<rect x="48" y="96" width="804" height="52" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="60" y="116" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="start" fill="#0f4d4d">Холодильные</text>
