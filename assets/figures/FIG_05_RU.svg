<rect x="48" y="414" width="804" height="36" fill="#e8f2f2" stroke="#0f4d4d" stroke-width="1.2"/>
<text x="60" y="436" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#111111">Типичная локация: 6–8 шкафов</text>
