<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
<rect width="900" height="640" fill="#ffffff"/>
<text x="48" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#111111">Controller and user-session architecture</text>

<!-- CONTROLLER 400 -->
<rect x="280" y="100" width="340" height="320" fill="#0f4d4d" stroke="#0f4d4d" stroke-width="1.2"/>
<text x="450" y="124" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">400 Controller</text>

<rect x="300" y="140" width="300" height="44" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="450" y="166" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">410 Tare event log</text>

<rect x="300" y="194" width="300" height="44" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="450" y="214" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">420 Expected exit tare weight</text>
<text x="450" y="228" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">calculation module</text>

<rect x="300" y="248" width="300" height="44" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="450" y="268" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">430 Discrepancy &amp; substitution</text>
<text x="450" y="282" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">detection module</text>

<rect x="300" y="302" width="300" height="44" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="450" y="328" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">440 Protective response module</text>

<!-- Left: Tare ID modules -->
<rect x="48" y="180" width="200" height="88" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="148" y="204" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">450 Tare ID assignment</text>
<text x="148" y="218" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">455 Tare identification</text>
<line x1="248" y1="224" x2="272" y2="224" stroke="#222222" stroke-width="1.8"/>
<polygon points="278,224 270,220 270,228" fill="#222222"/>

<!-- Right top: Profile store -->
<rect x="652" y="140" width="200" height="72" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="752" y="168" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">460 Tare profile store</text>
<text x="752" y="184" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">baseline · deviation range</text>
<line x1="620" y1="176" x2="644" y2="176" stroke="#222222" stroke-width="1.8"/>
<polygon points="650,176 642,172 642,180" fill="#222222"/>

<!-- Bottom: Retail module -->
<rect x="340" y="460" width="220" height="72" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="450" y="488" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">500 Retail module(s)</text>
<text x="450" y="504" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">tare-change events · multi-session</text>
<line x1="450" y1="420" x2="450" y2="452" stroke="#222222" stroke-width="1.8"/>
<polygon points="450,458 446,450 454,450" fill="#222222"/>

<!-- Bottom left: Entry group -->
<rect x="80" y="460" width="160" height="56" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="160" y="492" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">100 Entry group</text>
<line x1="160" y1="460" x2="360" y2="400" stroke="#222222" stroke-width="1.2" stroke-dasharray="5,4"/>

<!-- Bottom right: Exit group -->
<rect x="660" y="460" width="160" height="56" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="740" y="492" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">300 Exit group</text>
<line x1="540" y1="400" x2="740" y2="460" stroke="#222222" stroke-width="1.2" stroke-dasharray="5,4"/>

<!-- Cloud 470 -->
<rect x="652" y="280" width="200" height="56" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="752" y="312" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">470 Cloud platform</text>
<line x1="620" y1="260" x2="648" y2="300" stroke="#222222" stroke-width="1.2" stroke-dasharray="5,4"/>

<text x="48" y="620" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#111111">FIG. 2</text>
<text x="100" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#111111">Controller architecture</text>
</svg>
