<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
<rect width="900" height="640" fill="#ffffff"/>
<text x="48" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#111111">Entry and exit architecture (front view)</text>

<!-- ENTRY GROUP 100 -->
<rect x="48" y="88" width="188" height="420" fill="none" stroke="#222222" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="58" y="108" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#111111">100 Entry group</text>
<rect x="62" y="118" width="160" height="52" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="142" y="138" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">110 Entry monitor</text>
<text x="142" y="152" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">terms · consent</text>
<rect x="62" y="182" width="160" height="64" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="142" y="202" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">120 Tare registration</text>
<text x="142" y="216" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">130 Weighing structure</text>
<text x="142" y="230" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">tare ID · initial weight</text>
<rect x="62" y="262" width="160" height="36" fill="#e8f2f2" stroke="#0f4d4d" stroke-width="1.2"/>
<text x="142" y="284" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#0f4d4d">140 Entry barrier</text>
<text x="142" y="330" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#555555">User</text>
<polygon points="142,342 134,358 150,358" fill="#222222"/>
<line x1="142" y1="358" x2="142" y2="378" stroke="#222222" stroke-width="1.8"/>
<polygon points="142,384 136,374 148,374" fill="#222222"/>

<!-- RETAIL ZONE 200 -->
<rect x="260" y="88" width="380" height="420" fill="none" stroke="#222222" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="270" y="108" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#111111">200 Retail zone</text>
<rect x="290" y="130" width="90" height="56" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="335" y="152" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#111111">502 Module</text>
<rect x="405" y="130" width="90" height="56" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="450" y="152" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#111111">503 Module</text>
<rect x="520" y="130" width="90" height="56" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="565" y="152" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#111111">504 Module</text>
<text x="450" y="178" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">500 Retail module(s)</text>
<rect x="330" y="220" width="240" height="72" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="450" y="248" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">210 Return zone</text>
<text x="450" y="264" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">system-provided tare</text>
<text x="450" y="278" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">return · permitted leave</text>
<text x="450" y="340" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#555555">Shopping session</text>
<text x="450" y="360" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">tare-change events</text>

<!-- EXIT GROUP 300 -->
<rect x="664" y="88" width="188" height="420" fill="none" stroke="#222222" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="674" y="108" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#111111">300 Exit group</text>
<rect x="678" y="182" width="160" height="64" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="758" y="202" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">310 Exit verification</text>
<text x="758" y="216" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">re-ID · exit weight</text>
<rect x="678" y="118" width="160" height="44" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="758" y="144" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">330 Alert interface</text>
<rect x="678" y="262" width="160" height="36" fill="#e8f2f2" stroke="#0f4d4d" stroke-width="1.2"/>
<text x="758" y="284" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#0f4d4d">320 Exit barrier</text>
<polygon points="758,342 750,358 766,358" fill="#222222"/>
<line x1="758" y1="358" x2="758" y2="378" stroke="#222222" stroke-width="1.8"/>
<text x="758" y="330" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#555555">User</text>

<!-- Flow arrows entry -> retail -> exit -->
<line x1="236" y1="280" x2="252" y2="280" stroke="#222222" stroke-width="1.8"/>
<polygon points="258,280 250,276 250,284" fill="#222222"/>
<line x1="640" y1="280" x2="656" y2="280" stroke="#222222" stroke-width="1.8"/>
<polygon points="662,280 654,276 654,284" fill="#222222"/>

<text x="48" y="620" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#111111">FIG. 1</text>
<text x="100" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#111111">Entry and exit architecture</text>
</svg>
