<text x="375" y="146" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">130 · 600 dual-zone</text>
<line x1="434" y1="146" x2="446" y2="146" stroke="#222222" stroke-width="1.8"/>
<polygon points="452,146 444,142 444,150" fill="#222222"/>

<rect x="454" y="110" width="118" height="72" fill="#e8f2f2" stroke="#0f4d4d" stroke-width="1.2"/>
