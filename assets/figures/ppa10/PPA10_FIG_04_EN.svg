<text x="366" y="346" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">420 vs exit weight</text>
<text x="366" y="360" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">430 ID continuity</text>
<line x1="446" y1="346" x2="464" y2="346" stroke="#222222" stroke-width="1.8"/>
<polygon points="470,346 462,342 462,350" fill="#222222"/>

<!-- Decision split -->
<rect x="472" y="310" width="120" height="72" fill="#e8f2f2" stroke="#0f4d4d" stroke-width="1.2"/>
<text x="532" y="338" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#0f4d4d">Pass?</text>
<line x1="592" y1="330" x2="620" y2="330" stroke="#222222" stroke-width="1.8"/>
<polygon points="626,330 618,326 618,334" fill="#222222"/>
<line x1="592" y1="362" x2="620" y2="400" stroke="#222222" stroke-width="1.8"/>
<polygon points="624,406 616,398 622,400" fill="#222222"/>

<rect x="628" y="310" width="152" height="72" fill="#e8f2f2" stroke="#0f4d4d" stroke-width="1.2"/>
<text x="704" y="338" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#0f4d4d">Release</text>
<text x="704" y="352" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">320 unlock exit</text>
<text x="704" y="366" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">close session</text>

<rect x="628" y="420" width="200" height="72" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="728" y="448" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">440 Protective response</text>
<text x="728" y="462" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">lock · re-weigh · inspect</text>
<text x="728" y="476" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">330 alert · operator</text>

<line x1="450" y1="276" x2="190" y2="304" stroke="#222222" stroke-width="1.2" stroke-dasharray="5,4"/>

<text x="48" y="620" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#111111">FIG. 4</text>
<text x="100" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#111111">User-session workflow</text>
</svg>
