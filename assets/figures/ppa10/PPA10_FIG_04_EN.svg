<text x="190" y="346" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">310 re-ID · weigh</text>
<line x1="260" y1="346" x2="278" y2="346" stroke="#222222" stroke-width="1.8"/>
<polygon points="284,346 276,342 276,350" fill="#222222"/>

<rect x="286" y="310" width="160" height="72" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
