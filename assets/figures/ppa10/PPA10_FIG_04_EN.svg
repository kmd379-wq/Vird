<text x="657" y="142" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">500 tare-change</text>
<text x="657" y="156" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">410 event log</text>
<line x1="722" y1="146" x2="734" y2="146" stroke="#222222" stroke-width="1.8"/>
<polygon points="740,146 732,142 732,150" fill="#222222"/>

<rect x="742" y="110" width="118" height="72" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="801" y="128" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">Return zone</text>
<text x="801" y="142" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">210 optional</text>
<text x="801" y="156" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">exclude from exit</text>

<!-- Row 2: Multi-session branch -->
<rect x="200" y="220" width="500" height="56" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="450" y="244" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">Multi-session allocation (500 · 400)</text>
<text x="450" y="260" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">low confidence ’ ambiguity event ’ verification mode</text>
<line x1="657" y1="182" x2="657" y2="208" stroke="#222222" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="450" y1="182" x2="450" y2="208" stroke="#222222" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- Row 3: Exit path -->
<rect x="120" y="310" width="140" height="72" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
