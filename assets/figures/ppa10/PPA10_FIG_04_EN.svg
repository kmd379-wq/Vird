<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
<rect width="900" height="640" fill="#ffffff"/>
<text x="48" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#111111">User-session workflow</text>

<!-- Row 1: Entry path -->
<rect x="40" y="110" width="118" height="72" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="99" y="132" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">Terms &amp; consent</text>
<text x="99" y="146" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">110 Entry monitor</text>
<line x1="158" y1="146" x2="170" y2="146" stroke="#222222" stroke-width="1.8"/>
<polygon points="176,146 168,142 168,150" fill="#222222"/>

<rect x="178" y="110" width="118" height="72" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
<text x="237" y="132" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#111111">Tare ID assign</text>
<text x="237" y="146" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle" fill="#555555">450 · 455</text>
<line x1="296" y1="146" x2="308" y2="146" stroke="#222222" stroke-width="1.8"/>
<polygon points="314,146 306,142 306,150" fill="#222222"/>

<rect x="316" y="110" width="118" height="72" fill="#fafafa" stroke="#222222" stroke-width="1.2"/>
